name: Reporte de defecto
description: Registra un comportamiento reproducible que no cumple el resultado esperado.
title: "[BUG] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: No incluyas contraseñas, tokens, cookies ni información personal.
  - type: input
    id: environment
    attributes:
      label: Entorno y versión
      placeholder: Local, commit, navegador, sistema operativo
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Precondiciones
      placeholder: Estado necesario antes de reproducir el defecto
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad propuesta
      options:
        - Crítica
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia no sensible
      description: HTTP status, X-Request-ID, jobId, captura o fragmento de log sanitizado.
