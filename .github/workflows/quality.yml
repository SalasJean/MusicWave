name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/

  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static analysis and unit regression
        working-directory: frontend
        run: |
          npm run check
          npm run lint
          npm run format
          npm test
          npm run build
          npm audit --audit-level=moderate

  black-box-regression:
    needs: [backend-regression, frontend-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUSICWAVE_POSTGRES_PORT: '55432'
      API_BASE_URL: http://localhost:8080
      UI_BASE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: browser-actions/setup-chrome@v2
      - name: Start API and worker dependencies
        run: docker compose -f infrastructure/compose.yaml up -d --build api worker
      - name: Wait for API and worker readiness
        run: |
          for attempt in {1..60}; do
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/actuator/health/readiness || true)"
            tools_status="$(curl --silent http://localhost:8080/api/v1/tools/status || true)"
            if [ "$api_status" = "200" ] && printf '%s' "$tools_status" | grep -q '"status":"READY"'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f infrastructure/compose.yaml ps
          exit 1
      - name: Verify live OpenAPI contract
        run: ./scripts/verify-openapi.sh
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run dev -- --host 127.0.0.1 > /tmp/musicwave-frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/musicwave-frontend.log
          exit 1
      - name: Run Karate and Selenium
        run: ./backend/gradlew -p qa test --no-daemon
      - name: Upload black-box reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-box-test-reports
          path: qa/build/reports/tests/
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f infrastructure/compose.yaml logs --tail=200 api worker
      - name: Stop test environment
        if: always()
        run: docker compose -f infrastructure/compose.yaml down -v --remove-orphans
