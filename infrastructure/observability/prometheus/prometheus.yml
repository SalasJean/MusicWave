global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: musicwave-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8080]

  - job_name: musicwave-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [worker:8081]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
