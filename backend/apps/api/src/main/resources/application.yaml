spring:
  application:
    name: musicwave-api
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 300KB
  datasource:
    url: ${MUSICWAVE_DB_URL:jdbc:postgresql://localhost:5432/musicwave}
    username: ${MUSICWAVE_DB_USER:musicwave}
    password: ${MUSICWAVE_DB_PASSWORD:musicwave}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${MUSICWAVE_RABBITMQ_HOST:localhost}
    port: ${MUSICWAVE_RABBITMQ_PORT:5672}
    username: ${MUSICWAVE_RABBITMQ_USER:musicwave}
    password: ${MUSICWAVE_RABBITMQ_PASSWORD:musicwave}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
  data:
    redis:
      host: ${MUSICWAVE_REDIS_HOST:localhost}
      port: ${MUSICWAVE_REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1

musicwave:
  version: 0.1.0-SNAPSHOT
  security:
    mode: ${MUSICWAVE_SECURITY_MODE:jwt}
    max-active-jobs-per-owner: ${MUSICWAVE_MAX_ACTIVE_JOBS_PER_OWNER:1000}
    rate-limit:
      key-prefix: ${MUSICWAVE_RATE_LIMIT_KEY_PREFIX:musicwave:rate-limit:mutations}
      requests: ${MUSICWAVE_RATE_LIMIT_REQUESTS:60}
      window: ${MUSICWAVE_RATE_LIMIT_WINDOW:PT1M}
    local-owner-id: ${MUSICWAVE_LOCAL_OWNER_ID:00000000-0000-0000-0000-000000000001}
    local-owner-subject: ${MUSICWAVE_LOCAL_OWNER_SUBJECT:local-development-user}
    jwt:
      issuer: ${MUSICWAVE_JWT_ISSUER:}
      audience: ${MUSICWAVE_JWT_AUDIENCE:}
      jwk-set-uri: ${MUSICWAVE_JWT_JWK_SET_URI:}
      hmac-secret: ${MUSICWAVE_JWT_HMAC_SECRET:}
  title:
    timeout: ${MUSICWAVE_TITLE_TIMEOUT:PT3S}
    max-attempts: ${MUSICWAVE_TITLE_MAX_ATTEMPTS:3}
    retry-base-delay: ${MUSICWAVE_TITLE_RETRY_BASE_DELAY:PT10S}
    batch-size: ${MUSICWAVE_TITLE_BATCH_SIZE:10}
    initial-delay: ${MUSICWAVE_TITLE_INITIAL_DELAY:PT2S}
    scan-interval: ${MUSICWAVE_TITLE_SCAN_INTERVAL:PT5S}
  messaging:
    confirm-timeout: ${MUSICWAVE_RABBITMQ_CONFIRM_TIMEOUT:PT5S}
    outbox-lease: ${MUSICWAVE_OUTBOX_LEASE:PT30S}
    outbox-batch-size: ${MUSICWAVE_OUTBOX_BATCH_SIZE:50}
    outbox-initial-delay: ${MUSICWAVE_OUTBOX_INITIAL_DELAY:PT1S}
    outbox-scan-interval: ${MUSICWAVE_OUTBOX_SCAN_INTERVAL:PT1S}
    publish-retry-base-delay: ${MUSICWAVE_PUBLISH_RETRY_BASE_DELAY:PT1S}
    publish-retry-max-delay: ${MUSICWAVE_PUBLISH_RETRY_MAX_DELAY:PT1M}
  tools:
    heartbeat-max-age: ${MUSICWAVE_TOOL_HEARTBEAT_MAX_AGE:PT30S}
  realtime:
    stream-key: ${MUSICWAVE_REALTIME_STREAM_KEY:musicwave:download-events}
    max-length: ${MUSICWAVE_REALTIME_MAX_LENGTH:10000}
    read-batch-size: ${MUSICWAVE_REALTIME_READ_BATCH_SIZE:100}
    read-block: ${MUSICWAVE_REALTIME_READ_BLOCK:PT5S}
    heartbeat-interval: ${MUSICWAVE_REALTIME_HEARTBEAT_INTERVAL:PT15S}
    connection-timeout: ${MUSICWAVE_REALTIME_CONNECTION_TIMEOUT:PT30M}
    max-connections: ${MUSICWAVE_REALTIME_MAX_CONNECTIONS:100}
  storage:
    backend: ${MUSICWAVE_STORAGE_BACKEND:s3}
    endpoint: ${MUSICWAVE_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${MUSICWAVE_STORAGE_BUCKET:musicwave}
    region: ${MUSICWAVE_STORAGE_REGION:us-east-1}
    path-style: ${MUSICWAVE_STORAGE_PATH_STYLE:true}
    access-key: ${MUSICWAVE_STORAGE_ACCESS_KEY:}
    secret-key: ${MUSICWAVE_STORAGE_SECRET_KEY:}
    local-root: ${MUSICWAVE_STORAGE_LOCAL_ROOT:/var/lib/musicwave/artifacts}
    delivery-lease: ${MUSICWAVE_STORAGE_DELIVERY_LEASE:PT30M}
    deletion-lease: ${MUSICWAVE_STORAGE_DELETION_LEASE:PT1M}
    deletion-retry-delay: ${MUSICWAVE_STORAGE_DELETION_RETRY_DELAY:PT30S}
    cleanup-batch-size: ${MUSICWAVE_STORAGE_CLEANUP_BATCH_SIZE:50}
    cleanup-initial-delay: ${MUSICWAVE_STORAGE_CLEANUP_INITIAL_DELAY:PT10S}
    cleanup-interval: ${MUSICWAVE_STORAGE_CLEANUP_INTERVAL:PT30S}

management:
  tracing:
    sampling:
      probability: ${MUSICWAVE_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MUSICWAVE_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${MUSICWAVE_TRACING_ENABLED:false}
      connect-timeout: ${MUSICWAVE_OTLP_CONNECT_TIMEOUT:1s}
      timeout: ${MUSICWAVE_OTLP_TIMEOUT:3s}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${MUSICWAVE_ENVIRONMENT:local}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  structured:
    format:
      console: ${MUSICWAVE_LOG_FORMAT:ecs}
    ecs:
      service:
        environment: ${MUSICWAVE_ENVIRONMENT:local}
        version: ${musicwave.version}
    json:
      stacktrace:
        max-length: 8192
